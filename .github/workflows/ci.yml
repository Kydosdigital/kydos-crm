name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Generate Next.js types
        run: npx next typegen
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
